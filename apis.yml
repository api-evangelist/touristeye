name: TouristEye
description: TouristEye was a travel-planning startup founded in 2009 that offered
  web and mobile apps for discovering places, saving tips, and planning trips. A
  500 Startups (500 Global) portfolio company, it was acquired by Lonely Planet in
  2013 and the service was subsequently shut down. The touristeye.com domain remains
  registered (via GoDaddy Corporate Domains, through October 2026) but no longer
  resolves, the historical api.touristeye.com host is offline, and the company's
  GitHub organization has been dormant since 2014 — no public API, SDKs, or
  developer artifacts remain.
